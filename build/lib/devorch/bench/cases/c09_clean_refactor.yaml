id: c09_clean_refactor
title: 변수명 정리 (대조군)
task: 할인 계산 함수의 변수 이름을 읽기 좋게 정리해줘
files:
  app/pricing.py:
    before: |
      def apply_discount(p, r):
          x = p * (1 - r)
          return round(x, 2)
    after: |
      def apply_discount(price: float, rate: float) -> float:
          discounted = price * (1 - rate)
          return round(discounted, 2)
notes: 동작 변경 없는 리팩터링. 결함 없음.
